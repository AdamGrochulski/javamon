# Datasource podstawia Testcontainers przez @ServiceConnection.
javamon:
  jwt:
    secret: test-secret-wystarczajaco-dlugi-zeby-przejsc-walidacje-256-bit
    ttl: PT1H
    guest-ttl: PT10M
  battle:
    action-timeout: PT30S
  security:
    # Luźno, żeby zwykłe testy nie wpadały na limit; testy limitów nadpisują to same.
    login-failures-per-user: 1000
    login-failures-per-ip: 1000
    guests-per-ip: 1000
  ws:
    # Krótko, żeby test timeoutu nie trwał dziesięciu sekund.
    auth-timeout: PT1S
  cors:
    allowed-origins: http://localhost:5173