spring:
  application:
    name: javamon

  # Brak profilu domyślnego jest celowy. Gdyby tu stało `dev`, deploy bez
  # ustawionej zmiennej środowiskowej wziąłby sekret JWT z application-dev.yml,
  # który leży w repozytorium — czyli każdy mógłby podpisać sobie token na
  # dowolne konto. Brak konfiguracji ma kończyć się odmową startu, nie
  # cichym użyciem znanego klucza.

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:javamon}
    username: ${POSTGRES_USER:javamon}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Schemat należy do Flywaya. Hibernate ma go tylko weryfikować —
      # nigdy nie generować.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Za Nginx Proxy Managerem: bez tego Spring widzi każde żądanie jako HTTP
  # z adresu proxy — psuje isSecure(), adres klienta w logach i limity per IP.
  forward-headers-strategy: framework

javamon:
  jwt:
    # Pusta wartość domyślna, żeby brak zmiennej dał czytelny komunikat
    # z JwtService, a nie związany literał "${JWT_SECRET}" w kluczu.
    secret: ${JWT_SECRET:}
    ttl: PT24H
    guest-ttl: PT2H
  battle:
    # Brak akcji od gracza w tym czasie -> auto-forfeit.
    action-timeout: PT30S
  security:
    # Limity antyprzemiałowe, patrz docs/security.md (B1, B2).
    login-failures-per-user: 10
    login-failures-per-ip: 30
    login-window: PT15M
    guests-per-ip: 5
    guest-window: PT1H
    guest-retention: PT24H
  ws:
    # Ile czasu połączenie ma na przysłanie ramki AUTH, zanim je zamkniemy (4408).
    auth-timeout: PT10S
  cors:
    # Lokalnie ustawia to profil dev. Na produkcji: CORS_ORIGINS=https://battle.adamgrochulski.dev
    allowed-origins: ${CORS_ORIGINS:}
